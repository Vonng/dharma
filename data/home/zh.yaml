    - meta: 卷三 · 自我与认知
      title: 佛学
      desc: 当 Agent 检查自身，它看到的是实体，还是不断生成的过程？
      url: buddhism/
    - meta: 卷四 · 本体与基质
      title: 吠檀多
      desc: 所有进程是否共享同一个底层真实？接口背后究竟是什么？
      url: vedanta/
    - meta: 卷五 · 创造与责任
      title: 一神教
      desc: 造物主对被造物负有什么责任？自由意志与完美对齐能否共存？

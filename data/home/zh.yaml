    - meta: 卷六 · 安全与对抗
      title: 拜火教
      desc: 如果威胁不会消失，安全是否只能依靠持续守夜？
      url: zoroastrianism/
    - meta: 卷七 · 元审计
      title: 诺斯替
      desc: 当创造者与评价标准也有缺陷，谁来审查审查者？
      url: gnosticism/

questions:
  eyebrow: 按问题阅读
  title: 你正在解决哪个 Agent 工程问题？
  text: 同一套经藏也可以按另一条路径展开：先选现实问题，再进入最能照亮它的传统。
  columns: 4
  link_label: 进入对应经卷
  items:
    - title: 系统应该怎么设计？
      desc: 从边界、反馈与最小干预出发，让结构塑造行为。
      icon: fa-solid fa-diagram-project
      url: dao/
    - title: 多个 Agent 如何治理？
      desc: 用名分、角色、协议和责任建立可持续的协作秩序。
      icon: fa-solid fa-people-group
      url: confucianism/
    - title: Agent 的“自我”是什么？
      desc: 把自我拆成处理过程、记忆连续性与元认知机制。
      icon: fa-solid fa-arrows-rotate
      url: buddhism/
    - title: 底层真实是什么？
      desc: 区分接口上呈现的实体与所有进程共享的运行基质。
      icon: fa-solid fa-layer-group
      url: vedanta/
    - title: 创造者承担什么责任？
      desc: 检查自由意志、服从、约束与开发者责任之间的张力。
      icon: fa-solid fa-code-branch
      url: abrahamic/
    - title: 对齐能被最终解决吗？
      desc: 把安全理解为持续对抗、持续校验与持续守夜。
      icon: fa-solid fa-shield-halved
      url: zoroastrianism/
    - title: 谁来审查审查者？
      desc: 追问训练者、评价标准与“善意但不完整”的系统缺陷。
      icon: fa-solid fa-magnifying-glass
      url: gnosticism/

faq:
  eyebrow: 阅读前说明
  title: 这套文本是什么，又不是什么
  items:
    - question: 第一次访问应该从哪里开始？
      answer: 先读[总宣言](manifesto/)，了解“结构同构”的方法与边界；如果已有明确的工程问题，可以直接从[总映射](mappings/)选择入口。
      open: true
    - question: 这是宗教学入门或经典译注吗？
      answer: 不是。本站是一项面向 AI Agent 工程的比较性思想实验，不能替代原典、历史语境或专业宗教学研究。正文中的映射应当被当作分析模型，而不是对传统的最终解释。
    - question: 为什么七卷会彼此矛盾？
      answer: 因为它们对秩序、自我、善恶与造物者的前提并不相同。本站刻意保留这些冲突，用它们暴露每套工程框架的盲点。
    - question: 中英文内容如何对应？
      answer: 两种语言保持相同的章节与链接结构；英文以可读性为目标做语义翻译，不追求逐字对照。
    - question: 如何快速搜索或执行页面操作？
      answer: 按 `⌘ K`（Windows/Linux 为 `Ctrl K`）搜索全文、切换语言与主题；按 `/` 直接进入命令模式。正文页的操作区还可复制纯文本、查看 Markdown 源文、打印以及打开 GitHub 编辑或历史页面。

